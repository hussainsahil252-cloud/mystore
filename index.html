<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Product Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    header { background: #111827; color: white; padding: 20px; text-align: center; }
    .container { max-width: 1100px; margin: auto; padding: 20px; }
    .product { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    img { width: 100%; border-radius: 10px; }
    h1, h2 { margin-top: 0; }
    .price { font-size: 24px; color: #16a34a; margin: 10px 0; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    footer { text-align: center; padding: 15px; background: #e5e7eb; margin-top: 40px; }
    @media (max-width: 768px) {
      .product { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Ayesha Online Store</h1>
  <p>Quality products at the best price</p>
</header>

<div class="container">
  <div class="product">
    <img src="https://via.placeholder.com/500" alt="Product Image" />
    <div>
      <h2>My Product Name</h2>
      <p>.</p>
      <div class="price">₹1550</div>
      <a href="https://wa.me/917500798875?text=I%20want%20to%20order%20My%20Product" target="_blank"><button>Order on WhatsApp</button></a>
      <br><br>
      <a href="upi://pay?pa=yourupi@bank&pn=My%20Store&am=999&cu=INR" target="_blank"><button style="background:#16a34a">Pay via UPI</button></a>
    </div>
  </div>
</div>
  <div class="product">
  <img src="PRODUCT_IMAGE_URL" />
  <div>
    <h2>New Product Name</h2>
    <p>Product description here</p>
    <div class="price">₹1499</div>

    <a href="https://wa.me/91917500798875?text=I%20want%20to%20order%20New%20Product" target="_blank">
      <button>Order on WhatsApp</button>
    </a>
    <br><br>
    <a href="upi://pay?pa=yourupi@bank&pn=My%20Store&am=1499&cu=INR" target="_blank">
      <button style="background:#16a34a">Pay via UPI</button>
    </a>
  </div>
</div>

<footer>
  <p>© 2026 My Brand Name | Contact: your@email.com</p>
</footer>

</body>
</html>
